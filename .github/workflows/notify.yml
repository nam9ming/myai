name: Notify

# CI 와 Preview 결과를 각각의 채널로 보낸다.
# main 브랜치에서 실패한 경우에는 #error 로도 함께 보낸다.
on:
  workflow_run:
    workflows: ["CI", "Preview"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  discord:
    name: discord
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: 결과 채널로 전송
        env:
          CH_CI: ${{ secrets.DISCORD_WEBHOOK_CI }}
          CH_DEPLOY: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          FALLBACK: ${{ secrets.DISCORD_WEBHOOK }}
          NAME: ${{ github.event.workflow_run.name }}
          STATUS: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          case "$NAME" in
            Preview) WEBHOOK="${CH_DEPLOY:-${FALLBACK:-}}"; CHANNEL="#deploy" ;;
            *)       WEBHOOK="${CH_CI:-${FALLBACK:-}}";     CHANNEL="#ci" ;;
          esac

          case "$STATUS" in
            success)   COLOR=3046231;  MARK="통과" ;;
            failure)   COLOR=11680302; MARK="실패" ;;
            cancelled) COLOR=6841958;  MARK="취소" ;;
            *)         COLOR=6841958;  MARK="$STATUS" ;;
          esac

          echo "라우팅: $NAME → $CHANNEL"
          export WEBHOOK
          export FIELDS="저장소=${REPO}
          브랜치=${BRANCH}
          실행자=${ACTOR}"
          bash scripts/discord-send.sh "${NAME} · ${MARK}" "" "$COLOR" "$RUN_URL"

      - name: main 실패는 오류 채널로도 전송
        if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ERROR }}
          NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export FIELDS="저장소=${REPO}
          브랜치=main"
          bash scripts/discord-send.sh "main 실패 · ${NAME}" \
            "기본 브랜치에서 실패했다. 배포 가능한 상태가 아니다." 11680302 "$RUN_URL"
