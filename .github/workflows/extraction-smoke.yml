name: OpenAI Extraction Smoke

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  extraction:
    name: openai-extraction-smoke
    if: github.event.label.name == 'run-openai-extraction' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 합성 자료로 실제 OpenAI 연결·원본 검증
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-6.1-sol' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p data/private
          python - <<'PY'
          from pathlib import Path
          from processing.extraction.validation import parse_input
          assert parse_input(Path('processing/examples/ai-smoke-input.json').read_bytes())['data_kind'] == 'synthetic'
          PY
          python -m processing.extraction run \
            --input processing/examples/ai-smoke-input.json \
            --preprocessing-version smoke-nfc-v1 \
            > data/private/extraction-smoke-receipt.json
          cat data/private/extraction-smoke-receipt.json

      - name: 합성 실행 원본 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openai-extraction-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/private/extraction-runs
            data/private/extraction-smoke-receipt.json
          retention-days: 3
          if-no-files-found: warn
