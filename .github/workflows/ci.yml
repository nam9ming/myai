name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: myai_test
          MYSQL_USER: myai_ci
          MYSQL_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: 린트
        run: npm run lint

      - name: 인프라 테스트·계약 예제 검증
        run: npm test

      - name: 백엔드 API·MySQL 마이그레이션 검증·빌드
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/myai_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
          DB_USERNAME: myai_ci
          DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          MYAI_MYSQL_TESTS: 'true'
        run: ./backend/gradlew -p backend test bootJar --no-daemon

      - name: 합성 HTML 시제품 패키징
        run: npm run build

      - name: 빌드 산출물 보관
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 14
          if-no-files-found: error

      - name: 백엔드 실행 JAR 보관
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ github.sha }}
          path: backend/build/libs/*.jar
          retention-days: 14
          if-no-files-found: error
