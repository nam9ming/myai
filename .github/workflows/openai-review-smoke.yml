name: OpenAI Review Smoke

on:
  push:
    branches: [feat/openai-code-review]

permissions:
  contents: read

jobs:
  smoke:
    if: github.repository == 'nam9ming/myai' && github.actor == 'YUNGI-KIM'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: 합성 diff로 실제 OpenAI 코드 리뷰 확인
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-6.1-sol' }}
        run: |
          set -euo pipefail
          cat > /tmp/openai-smoke.diff <<'DIFF'
          diff --git a/example.py b/example.py
          --- a/example.py
          +++ b/example.py
          @@ -1,2 +1,2 @@
           def add(a, b):
          -    return a + b
          +    return a - b
          DIFF
          node scripts/ai-review.mjs /tmp/openai-smoke.diff > /tmp/openai-review.md
          if ! grep -Fq '### AI 1차 코드리뷰' /tmp/openai-review.md; then
            cat /tmp/openai-review.md
            exit 1
          fi
          echo "실제 OpenAI 리뷰 생성 성공: $OPENAI_MODEL"
