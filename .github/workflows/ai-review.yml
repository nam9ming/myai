name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ai-review-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: ai-review
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: 변경분 추출
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git diff --no-ext-diff --no-textconv --no-color "$BASE_SHA...$HEAD_SHA" -- > /tmp/pr.diff
          wc -c /tmp/pr.diff

      - name: API 키 확인
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY 시크릿이 없어 AI 리뷰를 건너뜀"
          elif ! grep -Fq 'process.env.OPENAI_API_KEY' scripts/ai-review.mjs; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::기본 브랜치에 OpenAI 전환 반영 후 다음 PR부터 리뷰 실행"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: AI 1차 리뷰 생성
        if: steps.key.outputs.present == 'true' && hashFiles('scripts/ai-review.mjs') != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-6.1-sol' }}
        run: node scripts/ai-review.mjs /tmp/pr.diff > /tmp/review.md

      - name: PR에 리뷰 코멘트
        if: steps.key.outputs.present == 'true' && hashFiles('scripts/ai-review.mjs') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          MARKER='<!-- ai-review -->'
          BODY="${MARKER}
          $(cat /tmp/review.md)"

          ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                 --jq "[.[] | select(.body | contains(\"${MARKER}\"))][0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$BODY" >/dev/null
          fi
