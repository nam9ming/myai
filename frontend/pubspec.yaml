name: yeogi_it
description: 여기:it 시민 지역정보 Flutter Web 프론트엔드
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.11.1
  flutter_svg: 2.4.0
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/prototype/
    - assets/posters/
    - assets/fonts/NotoSansKR.woff2
  fonts:
    - family: serif
      fonts:
        - asset: assets/fonts/NotoSerifKR.ttf
          weight: 400
