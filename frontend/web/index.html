<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="내 동네의 교육, 지원, 행사와 생활 속 변화를 한곳에서. 여기:it 지역정보 시제품입니다.">
  <meta name="theme-color" content="#ee663b">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="여기:it">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>여기:it — 내 동네에 필요한 정보</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/NotoSansKR.woff2" as="fetch" crossorigin="anonymous">
  <style>
    #loading { position:fixed; inset:0; z-index:99999; display:flex; align-items:center; justify-content:center; background:#fff; color:#747970; font:14px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; transition:opacity .2s ease; }
    #loading .loading-content { width:calc(100% - 48px); max-width:360px; text-align:center; }
    #loading .loading-logo { margin-bottom:28px; color:#242724; font-size:44px; font-weight:800; line-height:1.3; letter-spacing:-2px; }
    #loading .loading-logo span { display:inline-block; color:#ee663b; animation:loading-pulse 1.5s ease-in-out infinite; }
    #loading .loading-track { position:relative; width:176px; height:3px; margin:0 auto 23px; border-radius:99px; background:#fff1e9; overflow:hidden; }
    #loading .loading-track::after { content:""; position:absolute; inset:0 auto 0 0; width:40%; border-radius:inherit; background:#ee663b; animation:loading-sweep 1.6s ease-in-out infinite; }
    #loading-message { margin:0; }
    #loading-help { margin:14px 0 0; font-size:12px; color:#888b83; }
    #loading-retry { margin-top:18px; min-height:44px; padding:10px 24px; border:0; border-radius:9px; background:#ee663b; color:#fff; font:inherit; cursor:pointer; }
    #loading-retry:focus-visible { outline:3px solid #efab81; outline-offset:4px; }
    #loading.is-exiting { opacity:0; pointer-events:none; }
    #loading[data-state="error"] .loading-logo span, #loading[data-state="error"] .loading-track::after { animation:none; }
    #loading[data-state="error"] .loading-track::after { width:100%; opacity:.35; }
    @keyframes loading-pulse { 0%,100% { opacity:.5; transform:scale(.94); } 50% { opacity:1; transform:scale(1.05); } }
    @keyframes loading-sweep { from { transform:translateX(-110%); } to { transform:translateX(350%); } }
    @media (prefers-reduced-motion:reduce) { #loading { transition:none; } #loading .loading-logo span, #loading .loading-track::after { animation:none; } #loading .loading-track::after { left:30%; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite" aria-atomic="true">
    <div class="loading-content">
      <div class="loading-logo" aria-hidden="true">여기<span>:</span>it</div>
      <div class="loading-track" aria-hidden="true"></div>
      <p id="loading-message">여기:it 소식을 준비하고 있어요…</p>
      <p id="loading-help" hidden>첫 실행에 필요한 파일을 받고 있어요. 카카오톡에서 계속 멈춘다면 메뉴에서 Safari로 열어주세요.</p>
      <button id="loading-retry" hidden type="button">다시 시도</button>
    </div>
  </div>
  <script>
    (() => {
      const message = document.getElementById('loading-message');
      const help = document.getElementById('loading-help');
      const retry = document.getElementById('loading-retry');
      const revealHelp = () => { help.hidden = false; retry.hidden = false; };
      const timer = setTimeout(revealHelp, 12000);
      const fail = () => {
        if (!document.getElementById('loading')) return;
        clearTimeout(timer);
        document.getElementById('loading').dataset.state = 'error';
        message.textContent = '화면을 불러오지 못했어요. 다시 시도해주세요.';
        revealHelp();
      };
      retry.addEventListener('click', () => {
        if (document.getElementById('loading')?.dataset.state === 'error') {
          const target = new URL(location.href);
          target.searchParams.set('startup', 'raw');
          location.replace(target.href);
        } else location.reload();
      });
      window.yeogiStartup = {
        phase(text) { message.textContent = text; },
        fail,
        complete() {
          clearTimeout(timer);
          performance.mark('yeogi-first-frame');
          const panel = document.getElementById('loading');
          if (!panel) return;
          if (matchMedia('(prefers-reduced-motion: reduce)').matches) panel.remove();
          else { panel.classList.add('is-exiting'); setTimeout(() => panel.remove(), 220); }
        },
      };
      window.addEventListener('flutter-first-frame', window.yeogiStartup.complete, { once: true });
      window.addEventListener('error', fail, true);
      window.addEventListener('unhandledrejection', fail);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
