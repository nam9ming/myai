<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="내 동네의 교육, 지원, 행사와 생활 속 변화를 한곳에서. 여기:it 지역정보 시제품입니다.">
  <meta name="theme-color" content="#ee663b">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="여기:it">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>여기:it — 내 동네에 필요한 정보</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" role="status" style="font:14px sans-serif;color:#747970;position:fixed;inset:0;display:grid;place-items:center;background:#fff">
    <div style="text-align:center;line-height:1.8;padding:24px;max-width:360px">
      <p id="loading-message">여기:it 소식을 준비하고 있어요…</p>
      <p id="loading-help" hidden style="font-size:12px">첫 실행에 필요한 파일을 받고 있어요. 카카오톡에서 계속 멈춘다면 메뉴에서 Safari로 열어주세요.</p>
      <button id="loading-retry" hidden type="button" style="margin-top:12px;padding:12px 24px;border:0;border-radius:9px;background:#ee663b;color:white;font:inherit">다시 시도</button>
    </div>
  </div>
  <script>
    (() => {
      const message = document.getElementById('loading-message');
      const help = document.getElementById('loading-help');
      const retry = document.getElementById('loading-retry');
      const revealHelp = () => { help.hidden = false; retry.hidden = false; };
      const timer = setTimeout(revealHelp, 12000);
      const fail = () => {
        if (!document.getElementById('loading')) return;
        clearTimeout(timer);
        message.textContent = '화면을 불러오지 못했어요. 다시 시도해주세요.';
        revealHelp();
      };
      retry.addEventListener('click', () => location.reload());
      window.yeogiStartup = {
        phase(text) { message.textContent = text; },
        fail,
        complete() { clearTimeout(timer); document.getElementById('loading')?.remove(); },
      };
      window.addEventListener('flutter-first-frame', window.yeogiStartup.complete, { once: true });
      window.addEventListener('error', fail, true);
      window.addEventListener('unhandledrejection', fail);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
