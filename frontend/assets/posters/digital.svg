<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540"><rect width="720" height="540" fill="#d9e5ef"/><text x="40" y="50" font-family="sans-serif" font-size="17" letter-spacing="2" fill="#325371">DIGITAL LIFE, ONE STEP AT A TIME</text><text x="40" y="128" font-family="sans-serif" font-size="54" font-weight="700" fill="#203f59">어렵지 않아요.</text><text x="40" y="193" font-family="sans-serif" font-size="54" font-weight="700" fill="#203f59">하나씩, 같이.</text><g transform="translate(450 230) rotate(9 70 120)"><rect width="145" height="235" rx="24" fill="#325371"/><rect x="9" y="14" width="127" height="204" rx="15" fill="#f4f6f0"/><rect x="45" y="20" width="56" height="8" rx="4" fill="#325371"/><rect x="26" y="57" width="38" height="38" rx="12" fill="#ef9669"/><rect x="81" y="57" width="38" height="38" rx="12" fill="#96b5a2"/><rect x="26" y="110" width="93" height="9" rx="4" fill="#c7d5df"/><rect x="26" y="133" width="69" height="9" rx="4" fill="#c7d5df"/></g><text x="40" y="421" font-family="sans-serif" font-size="20" fill="#203f59">스마트폰 기초 생활 수업</text><text x="40" y="456" font-family="sans-serif" font-size="16" fill="#45647c">나의 일상을 조금 더 편리하게</text><text x="40" y="510" font-family="sans-serif" font-size="12" fill="#45647c">여기:it 화면 시안용 예시 포스터</text></svg>
