    @keyframes dig {0%,45%,100% {transform:rotate(0)} 15%,28% {transform:rotate(-28deg)} 21%,34% {transform:rotate(15deg)}}
    @keyframes blink {0%,93%,97%,100% {transform:scaleY(1)} 95% {transform:scaleY(.15)}}
