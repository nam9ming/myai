services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: myai_dev
      MYSQL_USER: ${DB_USERNAME:-myai}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정해 주세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD를 설정해 주세요}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql_data:
