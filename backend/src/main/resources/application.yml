spring:
  application:
    name: myai-backend
  profiles:
    default: public
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/myai_dev?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:myai}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
      transaction-isolation: TRANSACTION_REPEATABLE_READ
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    clean-disabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
app:
  extraction:
    timeout-ms: ${MYAI_EXTRACTION_TIMEOUT_MS:60000}
  cors-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  calculation:
    python-executable: ${MYAI_PYTHON_EXECUTABLE:python3.13}
    workdir: ${MYAI_PYTHON_WORKDIR:}
    timeout-ms: ${MYAI_CALC_TIMEOUT_MS:5000}
